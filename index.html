<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link href="style.css" rel="stylesheet" />
    </head>
    <body>
        <section class="c-block__section">
            <h2>Primary Button</h2>
            <button class="c-button">Click me!</button>
        </section>
        <section class="c-block__section">
            <h2>Background colour and font colour changes.</h2>
            <button class="c-button c-button--secondary">Click me!</button>
        </section>
        <section class="c-block__section">
            <h2>Background colour changes.</h2>
            <button class="c-button c-button--disabled">Disabled</button>
        </section>
        <section class="c-block__section">
            <h2>Strobe on hover</h2>
            <button class="c-button c-button--party">PARTY TIME</button>
        </section>
    </body>
</html>
